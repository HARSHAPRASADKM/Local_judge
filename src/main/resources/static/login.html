<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in</title>
  <script>
    (function () {
      try {
        var t = localStorage.getItem("practice_theme");
        if (t !== "light" && t !== "dark") {
          t = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        }
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "dark");
      }
    })();
  </script>
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
  <button class="icon-btn" data-theme-toggle type="button" style="position:fixed;top:1rem;right:1rem;z-index:50">
    <svg class="moon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    <svg class="sun" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  </button>

  <main class="auth-box card">
    <h1 class="brand">Local<span>Judge</span></h1>
    <p class="muted">Personal coding practice. Local Ollama, no cloud AI bills.</p>
    <form id="loginForm" novalidate>
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="username" required />

      <label for="password">Password</label>
      <div class="pw-wrap">
        <input id="password" name="password" type="password" autocomplete="current-password" required />
        <button type="button" class="pw-eye" id="eye" aria-label="Show password" aria-pressed="false">Show</button>
      </div>

      <div class="row" style="margin-top:1rem">
        <button id="loginBtn" type="submit">Sign in</button>
        <a class="btn secondary" href="/register.html">Create account</a>
      </div>
    </form>
    <p id="msg" role="status" aria-live="polite"></p>
  </main>

  <script src="/js/api.js"></script>
  <script>
    if (getToken()) location.href = "/";
    bindThemeButtons();
    observeReveal();

    function bindThemeButtons() {
      document.querySelectorAll("[data-theme-toggle]").forEach(btn =>
        btn.addEventListener("click", () => toggleTheme()));
      syncThemeButtons();
    }

    document.getElementById("eye").onclick = () => {
      const pw = document.getElementById("password");
      const eye = document.getElementById("eye");
      const show = pw.type === "password";
      pw.type = show ? "text" : "password";
      eye.textContent = show ? "Hide" : "Show";
      eye.setAttribute("aria-pressed", String(show));
      eye.setAttribute("aria-label", show ? "Hide password" : "Show password");
    };

    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("loginBtn");
      setBusy(btn, true, "Signing in");
      try {
        const data = await api("/api/auth/login", {
          method: "POST",
          body: JSON.stringify({
            email: document.getElementById("email").value,
            password: document.getElementById("password").value
          })
        });
        setToken(data.token);
        localStorage.removeItem("practice_user");
        toast("Welcome back.", "success");
        setTimeout(() => location.href = "/", 350);
      } catch (err) {
        setMsg("msg", err.message, false);
      } finally {
        setBusy(btn, false);
      }
    });
  </script>
</body>
</html>
